<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Calculators</title>\n    <style>\n        body {\n            font-family: 'Arial', sans-serif;\n            background: linear-gradient(to right, #6a11cb, #2575fc);\n            color: white;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            overflow: hidden;\n        }\n        .calculator {\n            background: rgba(255, 255, 255, 0.1);\n            border-radius: 15px;\n            padding: 20px;\n            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);\n            backdrop-filter: blur(10px);\n        }\n        .error { color: red; }\n    </style>\n</head>\n<body>\n    <div class="calculator">\n        <h1>Calculators</h1>\n        <form id="hangingPoolForm">\n            <h2>Hanging Pool Calculator</h2>\n            <input type="number" id="hangingPoolInput" placeholder="Input here..." required />\n            <button type="submit">Calculate</button>\n            <div class="error" id="hangingPoolError"></div>\n        </form>\n        <form id="dailyBathingForm">\n            <h2>Daily 4h Bathing</h2>\n            <input type="number" id="dailyBathingInput" placeholder="Input here..." required />\n            <button type="submit">Calculate</button>\n            <div class="error" id="dailyBathingError"></div>\n        </form>\n        <form id="wujiPillsForm">\n            <h2>Wuji Pills Calculator</h2>\n            <input type="number" id="wujiPillsInput" placeholder="Input here..." required />\n            <button type="submit">Calculate</button>\n            <div class="error" id="wujiPillsError"></div>\n        </form>\n        <form id="reincarnationTreasureForm">\n            <h2>Reincarnation Treasure Calculator</h2>\n            <input type="number" id="reincarnationTreasureInput" placeholder="Input here..." required />\n            <button type="submit">Calculate</button>\n            <div class="error" id="reincarnationTreasureError"></div>\n        </form>\n    </div>\n    <script>\n        function validateInput(input) { return input && !isNaN(input); }\n        document.getElementById('hangingPoolForm').onsubmit = function(e) {\n            e.preventDefault();\n            const input = document.getElementById('hangingPoolInput').value;\n            if (validateInput(input)) {\n                // Perform calculation for Hanging Pool\n                console.log('Hanging Pool Calculation:', input);\n            } else {\n                document.getElementById('hangingPoolError').innerText = 'Invalid input!';\n            }\n        };\n        document.getElementById('dailyBathingForm').onsubmit = function(e) {\n            e.preventDefault();\n            const input = document.getElementById('dailyBathingInput').value;\n            if (validateInput(input)) {\n                // Perform calculation for Daily 4h Bathing\n                console.log('Daily 4h Bathing Calculation:', input);\n            } else {\n                document.getElementById('dailyBathingError').innerText = 'Invalid input!';\n            }\n        };\n        document.getElementById('wujiPillsForm').onsubmit = function(e) {\n            e.preventDefault();\n            const input = document.getElementById('wujiPillsInput').value;\n            if (validateInput(input)) {\n                // Perform calculation for Wuji Pills\n                console.log('Wuji Pills Calculation:', input);\n            } else {\n                document.getElementById('wujiPillsError').innerText = 'Invalid input!';\n            }\n        };\n        document.getElementById('reincarnationTreasureForm').onsubmit = function(e) {\n            e.preventDefault();\n            const input = document.getElementById('reincarnationTreasureInput').value;\n            if (validateInput(input)) {\n                // Perform calculation for Reincarnation Treasure\n                console.log('Reincarnation Treasure Calculation:', input);\n            } else {\n                document.getElementById('reincarnationTreasureError').innerText = 'Invalid input!';\n            }\n        };\n    </script>\n</body>\n</html>\n
